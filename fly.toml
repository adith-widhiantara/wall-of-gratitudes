# Ganti app dan primary_region sesuai akun Fly.io kamu.
app = "wall-of-gratitude"
primary_region = "sin"

[env]
  PORT = "8080"
  DATA_DIR = "/data"
  EVENT_TITLE = "Wall of Gratitude"
  # PUBLIC_URL diisi lewat secret: fly secrets set PUBLIC_URL=https://nama-app.fly.dev

[mounts]
  source = "gratitude_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/healthz"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
