<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Moderasi ucapan</title>
  <link rel="stylesheet" href="/app.css">
  <script src="/wall-logika.js" defer></script>
  <script src="/admin.js" defer></script>
</head>
<body class="halaman-admin">
  <main class="admin-wrap">
    <section id="masuk" class="masuk" hidden>
      <h1>Masuk moderasi</h1>
      <form id="form-masuk" novalidate>
        <div class="field">
          <label for="password">Password admin</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required>
          <p class="err" id="err-masuk" hidden></p>
        </div>
        <button type="submit" class="kirim">Masuk</button>
      </form>
    </section>

    <section id="panel" hidden>
      <header class="admin-kepala">
        <h1 id="judul">Moderasi ucapan</h1>
        <button type="button" id="keluar" class="tombol-kecil">Keluar</button>
      </header>

      <fieldset class="grup-admin">
        <legend>Muat ulang daftar otomatis</legend>
        <label for="jeda-admin">Jeda: <output id="out-jeda-admin" for="jeda-admin"></output></label>
        <input type="range" id="jeda-admin" min="5" max="60" step="1">
        <label class="pilihan"><input type="checkbox" id="mati-admin"> Mati, daftar tidak berubah sendiri</label>
      </fieldset>
      <button type="button" id="muat-ulang" class="tombol-sekunder" hidden>Muat ulang sekarang</button>

      <nav class="tabs" aria-label="Status ucapan">
        <button type="button" class="tab" data-status="pending" aria-pressed="true">Menunggu (<span id="n-pending">0</span>)</button>
        <button type="button" class="tab" data-status="approved" aria-pressed="false">Disetujui (<span id="n-approved">0</span>)</button>
        <button type="button" class="tab" data-status="rejected" aria-pressed="false">Ditolak (<span id="n-rejected">0</span>)</button>
      </nav>

      <div class="aksi-massal" id="aksi-massal">
        <button type="button" id="setujui-semua" class="tombol-sekunder">Setujui semua menunggu</button>
        <button type="button" id="auto-approve" class="tombol-sekunder" aria-pressed="false">Auto approve 5 menit</button>
      </div>

      <p id="status" class="status" role="status"></p>
      <p id="kosong" class="kosong-admin" hidden></p>
      <ul id="daftar" class="daftar"></ul>
      <section class="zona-hapus" aria-labelledby="hapus-judul">
        <h2 id="hapus-judul">Hapus semua ucapan</h2>
        <p>Salinan database dibuat dulu, lalu semua ucapan dihapus: menunggu, disetujui, dan ditolak. Dari layar ini tidak bisa dibatalkan.</p>
        <label for="ketik-hapus">Ketik HAPUS SEMUA untuk mengaktifkan tombol</label>
        <input id="ketik-hapus" type="text" autocomplete="off">
        <button type="button" id="hapus-semua" class="tombol-bahaya" disabled>Hapus semua ucapan</button>
        <p id="hasil-hapus" class="status" role="status"></p>
      </section>
    </section>
  </main>
</body>
</html>
